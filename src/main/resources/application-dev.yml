spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.18.7:8080/realms/MY_KEYCLOAK
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.18.7:5432/animal_adoption}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123ateo9}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: animal_adoption
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${SCHEMA_NAME:animal_adoption}

  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 8081

image-api:
  url: ${BASE_URL_IMAGE:http://192.168.18.7:8082}
  url-images: ${BASE_URL_IMAGE:http://192.168.18.7:8082}
keycloak-config:
  client-id: ANIMAL_ADOPTION_CLIENT
  client-secret: ${KEYCLOAK_CLIENT_SECRET}